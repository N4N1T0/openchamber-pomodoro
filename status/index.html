<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pomodoro</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: var(--oc-font); color: var(--oc-fg); }
      #root { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; min-width: 0; }
      .clock {
        font-family: var(--oc-mono); font-size: 1.25em; font-weight: 600;
        font-variant-numeric: tabular-nums; flex: 0 0 auto;
      }
      .label {
        flex: 1 1 auto; min-width: 0; color: var(--oc-muted); font-size: 0.85em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <span class="clock" id="clock">--:--</span>
      <span class="label" id="label">No session running</span>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
