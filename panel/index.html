<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pomodoro</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: var(--oc-font); color: var(--oc-fg); }
      #root { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.75rem; }

      .card {
        display: flex; flex-direction: column; gap: 0.625rem;
        padding: 0.75rem;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius);
        background: var(--oc-elevated);
      }
      .section-title { font-size: 0.8em; font-weight: 600; color: var(--oc-muted); padding: 0 0.25rem; }

      .accordion { display: flex; flex-direction: column; gap: 0.625rem; }
      .accordion > summary {
        cursor: pointer; list-style: none; font-size: 0.8em; font-weight: 600; color: var(--oc-muted);
        padding: 0.25rem;
      }
      .accordion > summary::-webkit-details-marker { display: none; }
      .accordion > summary::before { content: '▸ '; }
      .accordion[open] > summary::before { content: '▾ '; }
      .accordion > .fields, .accordion > .row { padding: 0 0.25rem; }

      .clock {
        font-family: var(--oc-mono); font-size: 3.75em; font-weight: 600; line-height: 1;
        text-align: center; font-variant-numeric: tabular-nums;
      }
      .phase { text-align: center; color: var(--oc-muted); font-size: 0.85em; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }

      .rounds { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
      .seg {
        font-size: 0.85em; padding: 0.25rem 0.625rem; border-radius: 999px;
        border: 1px solid var(--oc-border); color: var(--oc-muted);
      }
      .seg[data-state="current"] { color: var(--oc-fg); background: var(--oc-muted-surface); font-weight: 600; }
      .seg[data-state="done"] { text-decoration: line-through; opacity: 0.6; }

      .fields { display: flex; flex-direction: column; gap: 0.5rem; }

      .footer { margin: 0; padding: 0.25rem 0.75rem 0.75rem; text-align: center; font-size: 0.75em; color: var(--oc-subtle); }
      .footer a { color: var(--oc-primary-text); text-decoration: underline; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
